services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: islabr
      POSTGRES_PASSWORD: islabr
      POSTGRES_DB: islabr
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U islabr']
      interval: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://islabr:islabr@postgres:5432/islabr
    ports:
      - '2567:2567'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
